<!DOCTYPE html>
<html>
<head>
<script>
function showPassword() {

    let password = document.getElementById("pass");

    if(password.type=="password")
        password.type="text";
    else
        password.type="password";
}
</script>
</head>
<body>

<input type="password" id="pass">
<button onclick="showPassword()">Show / Hide</button>

</body>
</html>
